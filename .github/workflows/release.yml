name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: swift build && .build/debug/OpenThock --self-test
      - name: Build app and DMG
        run: ./scripts/build-app.sh && ./scripts/make-dmg.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenThock.dmg
            dist/OpenThock.zip
          generate_release_notes: true
